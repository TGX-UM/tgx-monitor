id: vhp1-legacy-host
name: VHP-1 legacy server (retired apps)
group: Legacy hosts
class: infra
criticality: low
owners: [egonw, marvinm2]
depends_on: []
public: false
public_summary: Names still served by the legacy VHP-1 server, tracked to drive their decommission or redirection.
links: []
notes: >-
  Outside the swarm. The legacy AOP apps (old AOP-Wiki SNORQL UI, grlc API, AOP app) were
  removed from this server on 2026-11-19; their names aopwiki.cloud, aopwiki-api.cloud and
  aopapp.cloud still resolve here and now present an expired certificate for another name,
  which is a DNS clean-up for the owners, not something to watch. Two retired app names
  answer 502. Checks assert these known states so a change is noticed;
  toxtempassistant.vhp4safety.nl, also on this server, belongs to the ToxTempAssistant target.
checks:
  - id: vhp1-retired-apps
    kind: roundtrip
    every: 1d
    describe: Two retired app names on the legacy server still answer 502 (known state).
    purpose: Tracks retired apps on the old server so we notice if they come back.
    request:
      steps:
        - {url: "https://o-qt-oecd.vhp4safety.nl/"}
        - {url: "https://biohackeu24.cloud.vhp4safety.nl/"}
    assert:
      - {that: steps.0.status, eq: 502}
      - {that: steps.1.status, eq: 502}
    inv_ids: [vhp1-domains]
