id: chembl-rdf-mirror
name: ChEMBL RDF mirror (SPARQL endpoint and Snorql UI)
group: Nanosafety and RDF
class: data
criticality: medium
owners: [egonw, marvinm2, ammar257ammar]
depends_on: [edge-tgx1, bigcat-domain-dns]
public: true
public_summary: A local SPARQL mirror of the ChEMBL RDF release (currently ChEMBL 33.0), with a Snorql UI.
links:
  - https://chemblmirror.rdf.bigcat-bioinformatics.org/
  - https://chemblmirror.rdf.bigcat-bioinformatics.org/sparql
notes: >-
  Heavy store (about 672M triples): checks use known IRIs or single-class counts only,
  never a whole-store COUNT. Loaded once; not reloaded. Ammar Ammar (original author) is
  listed for information only.
checks:
  - id: chembl-ui
    kind: http
    every: 15m
    via: [public, tgx1, tgx2]
    describe: The Snorql query page loads, through public DNS and on each node.
    request: {url: "https://chemblmirror.rdf.bigcat-bioinformatics.org/"}
    assert:
      - {that: status, eq: 200}
      - {that: body, contains: "<title>SNORQL: A SPARQL Explorer for the ChEMBL RDF</title>"}
      - {that: latency_ms, lt: 5000, warn: true}
    inv_ids: [chembl-ui-presence]

  - id: chembl-https-redirect
    kind: http
    every: 1h
    describe: Plain HTTP is redirected permanently to HTTPS.
    request: {url: "http://chemblmirror.rdf.bigcat-bioinformatics.org/", follow: false}
    assert:
      - {that: status, eq: 301}
      - {that: headers.location, eq: "https://chemblmirror.rdf.bigcat-bioinformatics.org/"}
    inv_ids: [chembl-ui-presence]

  - id: chembl-tls
    kind: tls
    every: 1d
    via: [tgx1, tgx2]
    describe: Both nodes serve a trusted Let's Encrypt certificate for the name, with time to spare.
    request: {host: chemblmirror.rdf.bigcat-bioinformatics.org}
    assert:
      - {that: verified, eq: true}
      - {that: is_traefik_default, eq: false}
      - {that: days_left, gte: 21, warn: true}
      - {that: days_left, gte: 10}
    inv_ids: [chembl-ui-presence]

  - id: chembl-dns
    kind: dns
    every: 1h
    describe: The name resolves to tgx1 through two public resolvers, and they agree.
    request: {name: chemblmirror.rdf.bigcat-bioinformatics.org, resolvers: [1.1.1.1, 9.9.9.9]}
    assert:
      - {that: node, eq: tgx1}
      - {that: consistent, eq: true}
    inv_ids: [bigcat-explicit-records]

  - id: chembl-sd
    kind: http
    every: 1d
    describe: The endpoint publishes a SPARQL service description that names its public HTTPS address.
    request:
      url: "https://chemblmirror.rdf.bigcat-bioinformatics.org/sparql"
      headers: {Accept: text/turtle}
    assert:
      - {that: status, eq: 200}
      - {that: body, contains: "sd:Service"}
      - {that: body, matches: '(?s)@prefix (ns\d+):\s*<https://chemblmirror\.rdf\.bigcat-bioinformatics\.org/>.*sd:endpoint\s+\1:sparql', label: "sd:endpoint is the public HTTPS URL"}
    inv_ids: [chembl-sd]

  - id: chembl-aspirin-canary
    kind: sparql
    every: 15m
    describe: The store answers a known-IRI lookup, CHEMBL25 is aspirin, so it is up and loaded.
    request:
      endpoint: "https://chemblmirror.rdf.bigcat-bioinformatics.org/sparql"
      file: q/rdf-portals-legacy/chembl-aspirin.rq
    assert:
      - {that: status, eq: 200}
      - {that: first.label, eq: ASPIRIN}
      - {that: first.id, eq: CHEMBL25}
      - {that: first.type, eq: "http://rdf.ebi.ac.uk/terms/chembl#SmallMolecule"}
      - {that: latency_ms, lt: 5000, warn: true}
    inv_ids: [chembl-canary-aspirin]

  - id: chembl-mechanism-canary
    kind: sparql
    every: 1h
    describe: Aspirin's mechanism of action and its target come back as a known answer.
    request:
      endpoint: "https://chemblmirror.rdf.bigcat-bioinformatics.org/sparql"
      file: q/rdf-portals-legacy/chembl-mechanism.rq
    assert:
      - {that: count, eq: 1}
      - {that: first.mech, eq: Cyclooxygenase inhibitor}
      - {that: first.target, eq: "http://rdf.ebi.ac.uk/resource/chembl/target/CHEMBL2094253"}
    inv_ids: [chembl-canary-mechanism]

  - id: chembl-classes
    kind: sparql
    every: 1h
    describe: Single proteins and documents, two single-class counts, match the loaded release.
    request:
      endpoint: "https://chemblmirror.rdf.bigcat-bioinformatics.org/sparql"
      file: q/rdf-portals-legacy/chembl-classes.rq
      pivot: {key: k, value: n}
    assert:
      - {that: by.singleProtein, eq: 9092}
      - {that: by.document, eq: 88629}
    inv_ids: [chembl-class-shape]

  - id: chembl-version
    kind: compare
    every: 6h
    timeout: 1m
    describe: The loaded ChEMBL release is the expected one; an amber note shows while EBI has published newer releases.
    request:
      endpoint: "https://chemblmirror.rdf.bigcat-bioinformatics.org/sparql"
      left: {sparql: {file: q/rdf-portals-legacy/chembl-version.rq, value: d}, extract: '/chembl/(\d+\.\d+)\.rdf'}
      right: {http_regex: {url: "https://ftp.ebi.ac.uk/pub/databases/chembl/ChEMBL-RDF/latest/", re: 'href="chembl_(\d+\.\d+)_'}, on_error: unknown}
    assert:
      - {that: left, eq: "33.0", label: "loaded release is 33.0 (no reload planned)"}
      - {that: equal, eq: true, warn: true, label: "mirror is on the newest EBI release"}
    inv_ids: [chembl-version]

  - id: chembl-replicas
    kind: swarm
    every: 5m
    via: [core]
    public: false
    describe: The Virtuoso and Snorql services both run their one replica.
    request: {check: replicas, services: ["chembl_*"]}
    assert:
      - {that: checked, eq: 2}
      - {that: not_converged_count, eq: 0}
    inv_ids: [chembl-swarm-replicas]

  - id: chembl-crash-loops
    kind: swarm
    every: 1h
    via: [core]
    public: false
    describe: Virtuoso has not crashed (segfault, exit 139) or crash-looped in the last day.
    request: {check: crash_loops, services: ["chembl_*"], window: 24h, threshold: 3}
    assert:
      - {that: crash_looping_count, eq: 0}
      - {that: killed_count, eq: 0, warn: true}
    inv_ids: [chembl-swarm-replicas]
