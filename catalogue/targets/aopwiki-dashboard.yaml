      - {that: steps.41.json.success, eq: true, label: "oecd_status_distribution_absolute renders"}
      - {that: steps.42.json.success, eq: true, label: "oecd_status_distribution_percentage renders"}
      - {that: steps.43.json.success, eq: true, label: "oecd_status_journey renders"}
      - {that: steps.44.json.success, eq: true, label: "ontology_term_growth_absolute renders"}
      - {that: steps.45.json.success, eq: true, label: "ontology_term_growth_delta renders"}
