  - id: aopwiki-dashboard-data-shape
    kind: http
    every: 1h
    describe: The entity-count data behind the main trend plot is complete, typed as documented, and covers every release.
    request: {url: "https://aopwiki-dashboard.vhp4safety.nl/api/v2/data/aop_entity_counts_absolute", parse_json: true}
    assert:
      - {that: status, eq: 200}
      - {that: json.meta.complete, eq: true}
      - {that: json.meta.columns.0.name, eq: version}
      - {that: json.meta.columns.1.name, eq: Entity}
      - {that: json.meta.columns.2.name, eq: Count}
      - {that: json.meta.columns.2.type, eq: integer}
      - {that: json.meta.rows, gte: 140, label: "≥ 140 rows (35 releases × 4 entities)"}
      - {that: json.data.Count, len_gte: 140}
      - {that: headers.etag, exists: true}
    inv_ids: [dash-data-shape]

  - id: aopwiki-dashboard-features
    kind: roundtrip
    every: 1h
    describe: The AOP list, the network graph, an AOP detail page and a CSV download all work.
    request:
      base: "https://aopwiki-dashboard.vhp4safety.nl"
      steps:
        - {url: /api/aops}
        - {url: /api/network/graph}
        - {url: /aop, params: {aop: "1"}}
        - {url: /download/trend/aop_entity_counts_absolute}
    assert:
      - {that: completed, eq: true}
      - {that: steps.0.json.aops, len_gte: 590, label: "≥ 590 AOPs listed"}
      - {that: steps.0.json.aops.0.number, eq: 1}
      - {that: steps.1.json.elements, len_gte: 3000, label: "network ≥ 3,000 elements"}
      - {that: steps.1.json.version, exists: true}
      - {that: steps.2.status, eq: 200, label: "AOP 1 page loads"}
      - {that: last.status, eq: 200}
      - {that: last.headers.content-type, contains: text/csv}
      - {that: last.size, gte: 1000}
    inv_ids: [dash-features]
