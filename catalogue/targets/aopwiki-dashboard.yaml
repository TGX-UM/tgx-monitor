      - {that: steps.51.json.success, eq: true, label: "stressor_property_heatmap renders"}
      - {that: steps.52.json.success, eq: true, label: "stressor_property_presence_absolute renders"}
      - {that: steps.53.json.success, eq: true, label: "stressor_property_presence_percentage renders"}
      - {that: steps.54.json.success, eq: true, label: "unique_ke_components_absolute renders"}
      - {that: steps.55.json.success, eq: true, label: "unique_ke_components_delta renders"}
