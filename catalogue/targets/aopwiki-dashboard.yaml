id: aopwiki-dashboard
name: AOP-Wiki RDF Dashboard
group: AOP-Wiki RDF
class: service
criticality: medium
owners: [marvinm2]
depends_on: [edge-tgx1, aopwiki-multirdf]
maintenance: [dashboard-store-build]
public: true
public_summary: Interactive plots of how the AOP-Wiki has grown and changed across its quarterly releases.
links:
  - https://aopwiki-dashboard.vhp4safety.nl/
checks:
  - id: aopwiki-dashboard-health
    kind: http
    every: 15m
    via: [public, tgx1, tgx2]
    describe: The dashboard reports itself healthy, with every startup plot loaded and its SPARQL endpoint up (a degraded dashboard still answers 200).
    request: {url: "https://aopwiki-dashboard.vhp4safety.nl/health", parse_json: true}
    assert:
      - {that: status, eq: 200}
      - {that: json.status, eq: healthy}
      - {that: json.plots_loaded, matches: '^(\d+)/\1$', label: "all startup plots loaded (n/n)"}
      - {that: json.sparql_endpoint, eq: up}
      - {that: latency_ms, lt: 3000, warn: true}
    inv_ids: [dash-health]

  - id: aopwiki-dashboard-home
    kind: http
    every: 15m
    describe: The dashboard home page loads with its title.
    request: {url: "https://aopwiki-dashboard.vhp4safety.nl/"}
    assert:
      - {that: status, eq: 200}
      - {that: body, contains: "<title>AOP-Wiki RDF Dashboard</title>"}
    inv_ids: [dash-home]

  - id: aopwiki-dashboard-tls
    kind: tls
    every: 1d
    via: [tgx1, tgx2]
    describe: Both nodes serve a trusted certificate for the dashboard, not close to expiry.
    request: {host: aopwiki-dashboard.vhp4safety.nl}
    assert:
      - {that: verified, eq: true}
      - {that: is_traefik_default, eq: false}
      - {that: san, has: aopwiki-dashboard.vhp4safety.nl}
      - {that: days_left, gte: 21, warn: true}
      - {that: days_left, gte: 10}
    inv_ids: [dash-home]

  - id: aopwiki-dashboard-http-redirect
    kind: http
    every: 1d
    describe: Plain http on the dashboard name redirects permanently to https.
    request: {url: "http://aopwiki-dashboard.vhp4safety.nl/", follow: false}
    assert:
      - {that: status, in: [301, 308]}
      - {that: headers.location, matches: '^https://aopwiki-dashboard\.vhp4safety\.nl/'}
    inv_ids: [dash-home]

  - id: aopwiki-dashboard-versions
    kind: compare
    every: 1h
    describe: The dashboard, its plot store and the multi-release endpoint agree on the newest release, which is less than a quarter plus three weeks old.
    request:
      left: {http_json: {url: "https://aopwiki-dashboard.vhp4safety.nl/health", path: latest_version}}
      right: {http_json: {url: "https://aopwiki-dashboard.vhp4safety.nl/api/v2/manifest", path: latest_version}}
      sources:
        endpoint: {sparql: {endpoint: "https://aopwiki-multirdf.vhp4safety.nl/sparql", file: q/aopwiki/multirdf-newest-graph.rq, value: g}, extract: '(\d{4}-\d{2}-\d{2})$'}
        versions: {http_json: {url: "https://aopwiki-dashboard.vhp4safety.nl/api/v2/manifest", path: versions}}
    assert:
      - {that: left, eq_path: right, label: "/health latest_version == manifest latest_version"}
      - {that: left, eq_path: endpoint, label: "dashboard latest_version == newest multi-release graph"}
      - {that: left_age_days, lte: 113, label: "newest release ≤ 113 days old"}
      - {that: versions, len_gte: 35, label: "≥ 35 versions in the manifest"}
    inv_ids: [dash-version-consistency]

  - id: aopwiki-dashboard-plot-renders
    kind: roundtrip
    every: 15m
    describe: A trend plot and a latest-release snapshot plot both render with content.
    request:
      base: "https://aopwiki-dashboard.vhp4safety.nl"
      steps:
        - url: /health
          capture: {v: {json_path: latest_version}}
        - {url: /api/plot/aop_entity_counts_absolute}
        - {url: /api/plot/latest_aop_completeness, params: {version: "{v}"}}
    assert:
      - {that: completed, eq: true}
      - {that: steps.1.status, eq: 200}
      - {that: steps.1.json.success, eq: true, label: "trend plot renders"}
      - {that: steps.1.json.html, len_gte: 1000, label: "trend plot html > 1 KB"}
      - {that: last.status, eq: 200}
      - {that: last.json.success, eq: true, label: "snapshot plot renders"}
      - {that: last.json.html, len_gte: 1000, label: "snapshot plot html > 1 KB"}
    inv_ids: [dash-plot-renders]

  - id: aopwiki-dashboard-all-trends
    kind: roundtrip
    every: 6h
    timeout: 3m
    describe: Every plot on the trends page renders with data, not only the ones the health endpoint looks at.
