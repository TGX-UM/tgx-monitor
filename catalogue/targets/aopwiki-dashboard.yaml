        - {url: /api/plot/aop_authors_delta}
        - {url: /api/plot/aop_completeness_boxplot}
        - {url: /api/plot/aop_completeness_boxplot_all}
        - {url: /api/plot/aop_creation_vs_modification_timeline}
        - {url: /api/plot/aop_entity_counts_absolute}
        - {url: /api/plot/aop_entity_counts_delta}
        - {url: /api/plot/aop_network_density}
        - {url: /api/plot/aop_property_heatmap}
        - {url: /api/plot/aop_property_presence_absolute}
        - {url: /api/plot/aop_property_presence_percentage}
        - {url: /api/plot/aops_created_over_time}
        - {url: /api/plot/aops_per_stressor_distribution_absolute}
        - {url: /api/plot/aops_per_stressor_distribution_percentage}
        - {url: /api/plot/average_components_per_aop_absolute}
        - {url: /api/plot/average_components_per_aop_delta}
        - {url: /api/plot/biological_object_annotations_absolute}
        - {url: /api/plot/biological_object_annotations_delta}
        - {url: /api/plot/biological_process_annotations_absolute}
        - {url: /api/plot/biological_process_annotations_delta}
        - {url: /api/plot/entity_birth_death}
        - {url: /api/plot/entity_completeness_trends}
        - {url: /api/plot/entity_cumulative_removed}
        - {url: /api/plot/entity_survival}
        - {url: /api/plot/ke_component_annotations_absolute}
        - {url: /api/plot/ke_component_annotations_delta}
        - {url: /api/plot/ke_components_percentage_absolute}
        - {url: /api/plot/ke_components_percentage_delta}
        - {url: /api/plot/ke_migration_map}
        - {url: /api/plot/ke_mmo_coverage_absolute}
        - {url: /api/plot/ke_mmo_coverage_percentage}
        - {url: /api/plot/ke_property_heatmap}
        - {url: /api/plot/ke_property_presence_absolute}
        - {url: /api/plot/ke_property_presence_percentage}
        - {url: /api/plot/ker_curation_calendar}
        - {url: /api/plot/ker_property_heatmap}
        - {url: /api/plot/ker_property_presence_absolute}
        - {url: /api/plot/ker_property_presence_percentage}
        - {url: /api/plot/kes_by_kec_count_absolute}
        - {url: /api/plot/kes_by_kec_count_delta}
        - {url: /api/plot/oecd_completeness_trend}
        - {url: /api/plot/oecd_status_distribution_absolute}
        - {url: /api/plot/oecd_status_distribution_percentage}
        - {url: /api/plot/oecd_status_journey}
        - {url: /api/plot/ontology_term_growth_absolute}
        - {url: /api/plot/ontology_term_growth_delta}
        - {url: /api/plot/organ_coverage_absolute}
        - {url: /api/plot/organ_coverage_bump}
        - {url: /api/plot/organ_coverage_percentage}
        - {url: /api/plot/stressor_coverage_growth_absolute}
        - {url: /api/plot/stressor_coverage_growth_delta}
        - {url: /api/plot/stressor_property_heatmap}
        - {url: /api/plot/stressor_property_presence_absolute}
        - {url: /api/plot/stressor_property_presence_percentage}
        - {url: /api/plot/unique_ke_components_absolute}
        - {url: /api/plot/unique_ke_components_delta}
    assert:
      - {that: completed, eq: true}
      - {that: steps.0.json.success, eq: true, label: "aop_authors_absolute renders"}
      - {that: steps.1.json.success, eq: true, label: "aop_authors_delta renders"}
      - {that: steps.2.json.success, eq: true, label: "aop_completeness_boxplot renders"}
      - {that: steps.3.json.success, eq: true, label: "aop_completeness_boxplot_all renders"}
      - {that: steps.4.json.success, eq: true, label: "aop_creation_vs_modification_timeline renders"}
      - {that: steps.5.json.success, eq: true, label: "aop_entity_counts_absolute renders"}
      - {that: steps.6.json.success, eq: true, label: "aop_entity_counts_delta renders"}
      - {that: steps.7.json.success, eq: true, label: "aop_network_density renders"}
      - {that: steps.8.json.success, eq: true, label: "aop_property_heatmap renders"}
      - {that: steps.9.json.success, eq: true, label: "aop_property_presence_absolute renders"}
