id: llemy
name: Llemy (LLM agent over ONTOX physiological maps)
group: VHP4Safety tools
class: service
criticality: low
owners: [Maddocent, ext-03, ozancinar]
depends_on: [edge-tgx1]
public: true
public_summary: A Streamlit app that lets users query ONTOX physiological maps with a language model, using their own API key.
links: [https://llemy.vhp4safety.nl/]
checks:
  - id: llemy-health
    kind: http
    every: 15m
    describe: The Streamlit server reports healthy.
    purpose: Shows that the LLeMy app is running.
    request: {url: "https://llemy.vhp4safety.nl/_stcore/health"}
    assert:
      - {that: status, eq: 200}
      - {that: body, eq: ok}
    inv_ids: [llemy-health]

  - id: llemy-root
    kind: http
    every: 15m
    describe: The app page shell loads.
    purpose: Shows that people can open LLeMy.
    request: {url: "https://llemy.vhp4safety.nl/"}
    assert:
      - {that: status, eq: 200}
      - {that: headers.content-type, contains: text/html}
      - {that: body, contains: "<title>Streamlit"}
    inv_ids: [llemy-root]

  - id: llemy-browser
    kind: browser_artifact
    every: 1h
    via: [core]
    describe: In a real browser the app renders its sign-in screen without exceptions (the language-model path needs a user's own key and is not tested).
    purpose: Opens the app in a real browser, the way a user does, to catch errors a simple page load misses.
    request: {url: "https://raw.githubusercontent.com/TGX-UM/tgx-monitor/history/browser/latest.json", page: llemy}
    assert:
      - {that: page_found, eq: true}
      - {that: age_h, lt: 13}
      - {that: page.ok, eq: true}
    inv_ids: [llemy-render]
