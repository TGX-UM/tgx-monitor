id: wp-legacy-hosts
name: Retired WikiPathways host names
group: Legacy hosts
class: infra
criticality: muted
owners: [egonw, marvinm2]
depends_on: []
public: false
public_summary: Older WikiPathways host names, now redirect stubs or retired, tracked so a change is noticed.
links: []
notes: >-
  classic and webservice are GitHub Pages redirect stubs. new.wikipathways.org is a
  GitHub Pages site without a certificate for its custom name (TLS fails, the content is
  a redirect page). The cloud.vhp4safety.nl staging names were removed from the proxy
  and answer 404.
checks:
  - id: wp-legacy-stubs
    kind: roundtrip
    every: 1d
    describe: The classic and webservice names are redirect stubs to the current site.
    purpose: Old WikiPathways addresses should still send people to the current site.
    request:
      steps:
        - {url: "https://classic.wikipathways.org/"}
        - {url: "https://webservice.wikipathways.org/"}
    assert:
      - {that: steps.0.status, eq: 200}
      - {that: steps.0.body, contains: "url=https://wikipathways.org/classic.html"}
      - {that: steps.1.status, eq: 200}
      - {that: steps.1.body, contains: "url=https://wikipathways.org/json/index.html"}
    inv_ids: [legacy-classic]

  - id: wp-legacy-new-content
    kind: http
    every: 1d
    describe: new.wikipathways.org still serves the WikiPathways GitHub Pages redirect page (a change could mean someone else claimed the name).
    purpose: If this old address starts showing something else, someone else may have taken it over.
    request: {url: "https://new.wikipathways.org/", verify: false}
    assert:
      - {that: status, eq: 200}
      - {that: headers.server, eq: GitHub.com}
      - {that: body, contains: "Redirecting"}
    inv_ids: [legacy-new-tls]

  - id: wp-legacy-new-dns
    kind: dns
    every: 1h
    describe: new.wikipathways.org still points at the WikiPathways GitHub Pages account.
    purpose: If this old address moves elsewhere, someone else may have taken it over.
    request: {name: new.wikipathways.org, type: CNAME, resolvers: [1.1.1.1, 9.9.9.9]}
    assert:
      - {that: answers, has: wikipathways.github.io}
    inv_ids: [legacy-new-tls]

  - id: wp-legacy-staging
    kind: roundtrip
    every: 1d
    describe: The retired staging names still answer 404 from the proxy (known state; they serve nothing).
    purpose: These retired addresses should stay inactive; a change means something was set up without us knowing.
    request:
      steps:
        - {url: "https://wikipathways-sparql.cloud.vhp4safety.nl/"}
        - {url: "https://wikipathways-rdf.cloud.vhp4safety.nl/"}
    assert:
      - {that: steps.0.status, eq: 404}
      - {that: steps.1.status, eq: 404}
    inv_ids: [legacy-staging-404]
