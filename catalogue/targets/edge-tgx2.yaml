id: edge-tgx2
name: Web proxy on tgx2
group: Cluster
class: infra
criticality: high
owners: [egonw, marvinm2]
depends_on: []
public: true
public_summary: The web proxy on the second node, the failover target, answers HTTPS and redirects plain HTTP.
links: []
notes: >-
  No public name points at tgx2, so this proxy is only seen by probes pinned to its IP.
  It must work before DNS is ever swapped to tgx2 in an outage. File-provider edits do
  not reach this node by themselves (no inotify over GlusterFS), which is what the
  parity checks in traefik-routing catch.
checks:
  - id: edge-tgx2-https
    kind: http
    every: 5m
    via: [tgx2]
    describe: The proxy on tgx2 answers HTTPS for a routed name within a few seconds.
    request: {url: "https://platform.vhp4safety.nl/", follow: false, verify: false}
    assert:
      - {that: status, exists: true, label: "the proxy answered"}
      - {that: status, ne: 404, warn: true, label: "the route is loaded (404 means the proxy lost its routers)"}
      - {that: status, eq: 200, warn: true}
      - {that: latency_ms, lt: 3000, warn: true}
      - {that: latency_ms, lt: 15000}
    inv_ids: [tr-per-node-parity]

  - id: edge-tgx2-http-redirect
    kind: http
    every: 15m
    via: [tgx2]
    describe: Plain HTTP on tgx2 is redirected permanently to HTTPS on the same name.
    request: {url: "http://platform.vhp4safety.nl/", follow: false}
    assert:
      - {that: status, in: [301, 308]}
      - {that: headers.location, matches: '^https://platform\.vhp4safety\.nl/'}
    inv_ids: [tr-http-redirect]

  - id: edge-tgx2-dashboard-auth
    kind: security
    every: 1h
    via: [tgx2]
    describe: The proxy's admin dashboard on tgx2 asks for a password and shows nothing without one.
    timeout: 10s
    request: {url: "http://{node_ip}:8080/dashboard/", expect_status: [401]}
    assert:
      - {that: exposed, eq: false}
