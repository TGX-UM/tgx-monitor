id: pathvisio-site
name: PathVisio website and downloads
group: WikiPathways
class: service
criticality: low
owners: [mkutmon, egonw, marvinm2]
depends_on: []
public: true
public_summary: The PathVisio pathway editor's website, its download links and the plugin repository.
links: [https://pathvisio.org/, https://pathvisio.org/downloads.html]
checks:
  - id: pv-home
    kind: http
    every: 15m
    describe: The PathVisio home page loads.
    purpose: Shows that people can open the PathVisio website.
    request: {url: "https://pathvisio.org/"}
    assert:
      - {that: status, eq: 200}
      - {that: body, contains: "<title>PathVisio"}
    inv_ids: [pv-home]

  - id: pv-www-redirect
    kind: http
    every: 1h
    describe: www.pathvisio.org redirects to https://pathvisio.org/.
    purpose: Makes the www address land on the main site.
    request: {url: "https://www.pathvisio.org/"}
    assert:
      - {that: status, eq: 200}
      - {that: final_url, eq: "https://pathvisio.org/"}
    inv_ids: [pv-home]

  - id: pv-downloads
    kind: roundtrip
    every: 1h
    timeout: 60s
    describe: The download page links the zip, Windows, macOS and Linux installers, and each one downloads (checked with HEAD).
    purpose: People download PathVisio from here; this checks every installer actually downloads.
    request:
      steps:
        - url: https://pathvisio.org/downloads.html
          capture:
            zip: {regex: '(https://github\.com/PathVisio/pathvisio/releases/download/[^"]+\.zip)"'}
            exe: {regex: '(https://github\.com/PathVisio/pathvisio/releases/download/[^"]+\.exe)"'}
            dmg: {regex: '(https://github\.com/PathVisio/pathvisio/releases/download/[^"]+\.dmg)"'}
            sh: {regex: '(https://github\.com/PathVisio/pathvisio/releases/download/[^"]+\.sh)"'}
        - {method: HEAD, url: "{zip}", capture: {zip_len: {header: content-length}}}
        - {method: HEAD, url: "{exe}", capture: {exe_len: {header: content-length}}}
        - {method: HEAD, url: "{dmg}", capture: {dmg_len: {header: content-length}}}
        - {method: HEAD, url: "{sh}", capture: {sh_len: {header: content-length}}}
    assert:
      - {that: completed, eq: true, label: "all four download links found on the page"}
      - {that: steps.1.status, eq: 200}
      - {that: steps.2.status, eq: 200}
      - {that: steps.3.status, eq: 200}
      - {that: steps.4.status, eq: 200}
      - {that: captures.zip_len, gte: 10000000}
      - {that: captures.exe_len, gte: 10000000}
      - {that: captures.dmg_len, gte: 10000000}
      - {that: captures.sh_len, gte: 10000000}
    inv_ids: [pv-downloads]

  - id: pv-plugins-repo
    kind: http
    every: 1h
    describe: The plugin repository page that PathVisio's plugin manager reads is up.
    purpose: PathVisio installs its plugins from this page; if it is down, plugins can't be installed.
    request: {url: "https://pathvisio.github.io/plugins/plugins-repo"}
    assert:
      - {that: status, eq: 200}
      - {that: size, gte: 4000}
    inv_ids: [pv-plugins-repo]
