id: mct8-docking
name: MCT8 docking (binding prediction)
group: VHP4Safety tools
class: service
criticality: medium
owners: [ext-01, marvinm2, ozancinar]
depends_on: [edge-tgx1]
public: true
public_summary: Predicts whether compounds bind the thyroid hormone transporter MCT8 by molecular docking.
links: [https://mct8-docking.vhp4safety.nl/]
checks:
  - id: mct8-health
    kind: http
    every: 15m
    via: [public, tgx1, tgx2]
    describe: The docking service reports healthy, through public DNS and on each node.
    request: {url: "https://mct8-docking.vhp4safety.nl/health"}
    assert:
      - {that: status, eq: 200}
      - {that: body, contains: OK}
    inv_ids: [mct8-health]

  - id: mct8-root
    kind: http
    every: 15m
    describe: The docking page loads.
    request: {url: "https://mct8-docking.vhp4safety.nl/"}
    assert:
      - {that: status, eq: 200}
      - {that: body, contains: "<title>Predict binding to mct8 - VHP4Safety"}
      - {that: latency_ms, lt: 5000, warn: true}
    inv_ids: [mct8-root]

  - id: mct8-receptor
    kind: http
    every: 1h
    describe: The MCT8 receptor structure is served whole (8333 atoms).
    request: {url: "https://mct8-docking.vhp4safety.nl/api/receptor", parse_json: true}
    assert:
      - {that: status, eq: 200}
      - {that: json.name, eq: MCT8 Receptor}
      - {that: json.atoms, eq: 8333}
      - {that: size, gt: 600000}
    inv_ids: [mct8-receptor-shape]

  - id: mct8-binding-site
    kind: http
    every: 1h
    describe: The binding site definition is served whole (23 atoms).
    request: {url: "https://mct8-docking.vhp4safety.nl/api/binding_site", parse_json: true}
    assert:
      - {that: status, eq: 200}
      - {that: json.name, eq: Binding Site}
      - {that: json.atoms, eq: 23}
    inv_ids: [mct8-binding-site-shape]

  - id: mct8-estimate
    kind: http
    every: 1h
    describe: The run-time estimator answers from the history of real dockings (an estimate only, nothing is docked).
    request:
      url: "https://mct8-docking.vhp4safety.nl/api/estimate"
      method: POST
      json: {num_molecules: 1, num_modes: 3, exhaustiveness: 8, cnn: none, action: dock}
      parse_json: true
    assert:
      - {that: status, eq: 200}
      - {that: json.seconds, gt: 0}
      - {that: json.source, in: [history, fallback]}
      - {that: json.samples, gte: 51}
    inv_ids: [mct8-estimate]

  - id: mct8-debugger-off
    kind: security
    every: 1h
    describe: The development debugger console stays switched off.
    request:
      url: "https://mct8-docking.vhp4safety.nl/console"
      expect_status: [404]
      absent_markers: ["Interactive Console", "Werkzeug Debugger"]
    assert:
      - {that: exposed, eq: false}
    inv_ids: [mct8-debugger-off]

  - id: mct8-usage
    kind: file_age
    every: 1d
    via: [core]
    severity: low
    public: false
    describe: The run-time log of real dockings exists, and shows when the tool was last used.
    request: {mount: mct8-results, glob: runtimes.jsonl}
    assert:
      - {that: count, eq: 1}
      - {that: newest_size, gt: 0}
      - {that: newest_age_h, lt: 2160, warn: true, label: "a real docking run in the last 90 days"}
    inv_ids: [mct8-usage]

  - id: mct8-image
    kind: registry
    every: 1d
    via: [core]
    describe: The published image can be pulled, and both nodes hold a copy (a cold pull of 7.5 GB takes minutes).
    request: {image: "ghcr.io/vhp4safety/mct8-docking:latest"}
    assert:
      - {that: reachable, eq: true}
      - {that: missing_on_nodes, len_eq: 0, warn: true}
    inv_ids: [mct8-image-drift, registry-pullability]
