id: backup-wikipathways-submit-db
name: WikiPathways Curation Portal database backup
group: Jobs and backups
class: backup
criticality: medium
owners: [marvinm2]
depends_on: [swarm]
public: false
public_summary: The Curation Portal database (reviews, identifier reservations) is backed up off the cluster.
# Since 2026-11-11 cronjobs_wikipathways-submit-backup (02:45 UTC) writes a pg_dump custom-format
# file (-Fc, not gzip; checked with pg_restore --list by the job) beside the service and to the
# off-cluster drive under wikipathways-submit/, 14 kept. The check reads the off-cluster copy.
checks:
  - id: bk-wp-submit-exists
    kind: file_age
    every: 1h
    via: [core]
    describe: A dump of the Curation Portal database less than 26 hours old exists off the cluster.
    purpose: Without a backup, curators' reviews would be lost if the database broke.
    request: {mount: hidrive, glob: "wikipathways-submit/wikipathways-submit-*.dump", small_bytes: 5000}
    assert:
      - {that: count, gte: 1, label: "a backup exists"}
      - {that: newest_age_h, lt: 26}
      - {that: small_count, eq: 0}
    inv_ids: [cp-backup-fresh]

  - id: bk-wp-submit-db-running
    kind: swarm
    every: 15m
    via: [core]
    describe: The Curation Portal database service runs its one replica and has not been failing.
    purpose: The Curation Portal's database must be running for curators to work.
    request: {check: replicas, services: [wikipathways-submit-db]}
    assert:
      - {that: by.wikipathways-submit-db.running, eq: 1}
      - {that: not_converged_count, eq: 0}
    inv_ids: [cp-db-task]
