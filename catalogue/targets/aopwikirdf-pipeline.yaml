id: aopwikirdf-pipeline
name: AOPWikiRDF weekly RDF generation (GitHub Actions)
group: Pipelines
class: pipeline
criticality: high
owners: [marvinm2]
depends_on: [aopwiki-xml-upstream, bridgedb-webservice]
public: true
public_summary: Every Saturday GitHub Actions converts the AOP-Wiki XML export to RDF, maps genes and chemicals through BridgeDb, validates the result and commits it for the Sunday reload.
links:
  - https://github.com/marvinm2/AOPWikiRDF/actions/workflows/rdfgeneration.yml
# rdfgeneration.yml (cron Sat 08:00 UTC; GitHub starts it hours late) is followed by
# QC, SHACL and the Python test via workflow_run. The build itself aborts when the
# BridgeDb gene mapping rate falls below 50%. The rate, the publish-gate deltas and
# the BERN2 counts are only in the job log, which no kind reads yet.
checks:
  - id: aopwikirdf-generation
    kind: gha
    every: 1h
    describe: The weekly RDF generation workflow is enabled and its last run, less than eight days ago, succeeded.
    purpose: This Saturday job builds the weekly AOP-Wiki RDF; if it stops, the endpoint keeps serving old data.
    request: {repo: marvinm2/AOPWikiRDF, workflow: rdfgeneration.yml}
    assert:
      - {that: state, eq: active}
      - {that: completed_conclusion, eq: success}
      - {that: last_success_at, max_age: {crit: 8d}}
    inv_ids: [gen-run-success, ar-gen, aopwikirdf-bridgedb-gene-success-rate]

  - id: aopwikirdf-turtle-qc
    kind: gha
    every: 1h
    describe: The Turtle quality-control run on the newly generated files succeeded within the past eight days.
    purpose: Catches broken RDF files before they are loaded into the endpoint.
    request: {repo: marvinm2/AOPWikiRDF, workflow: Turtle_File_Quality_Control.yml}
    assert:
      - {that: state, eq: active}
      - {that: completed_conclusion, eq: success}
      - {that: last_success_at, max_age: {crit: 8d}}
    inv_ids: [gen-qc-chain, ar-qc-shacl]

  - id: aopwikirdf-shacl
    kind: gha
    every: 1h
    describe: The SHACL validation of the newly generated files succeeded within the past eight days.
    purpose: Catches RDF that does not follow the agreed data rules before it reaches users.
    request: {repo: marvinm2/AOPWikiRDF, workflow: shacl-validation.yml}
    assert:
      - {that: state, eq: active}
      - {that: completed_conclusion, eq: success}
      - {that: last_success_at, max_age: {crit: 8d}}
    inv_ids: [gen-qc-chain, ar-qc-shacl]

  - id: aopwikirdf-python-test
    kind: gha
    every: 1h
    describe: The test of the conversion script passed on its last run.
    purpose: The conversion code must pass its tests, or the weekly build may produce wrong data.
    request: {repo: marvinm2/AOPWikiRDF, workflow: test-python-conversion.yml}
    assert:
      - {that: state, eq: active}
      - {that: completed_conclusion, eq: success}
      - {that: last_success_at, max_age: {warn: 8d}}
    inv_ids: [gen-qc-chain]

  - id: aopwikirdf-uri-resolvability
    kind: gha
    every: 1h
    describe: The weekly check that the IRIs in the RDF resolve succeeded within the past eight days.
    purpose: The links inside the data should open in a browser; this catches ones that stopped working.
    request: {repo: marvinm2/AOPWikiRDF, workflow: uri-resolvability-check.yml}
    assert:
      - {that: state, eq: active}
      - {that: completed_conclusion, eq: success}
      - {that: last_success_at, max_age: {crit: 8d}}
    inv_ids: [uri-resolvability]

  - id: aopwikirdf-zenodo-upload
    kind: gha
    every: 1h
    describe: The monthly Zenodo deposit of the RDF succeeded within the past month.
    purpose: The monthly citable copy on Zenodo depends on this job succeeding.
    request: {repo: marvinm2/AOPWikiRDF, workflow: upload-to-zenodo.yml}
    assert:
      - {that: state, eq: active}
      - {that: completed_conclusion, eq: success}
      - {that: last_success_at, max_age: {crit: 32d}}
    inv_ids: [ar-zenodo]

  - id: aopwikirdf-artifact
    kind: http
    every: 6h
    describe: The newest generation left its RDF files as a downloadable artifact of normal size that has not expired.
    purpose: The Sunday reload needs these files; if they are missing or too small, it has nothing correct to load.
    request:
      url: https://api.github.com/repos/marvinm2/AOPWikiRDF/actions/artifacts
      params: {name: rdf-files, per_page: 1}
      headers: {Accept: application/vnd.github+json}
      parse_json: true
    assert:
      - {that: status, eq: 200}
      - {that: json.artifacts.0.expired, eq: false}
      - {that: json.artifacts.0.size_in_bytes, gte: 5000000, label: "artifact ≥ 5 MB"}
      - {that: json.artifacts.0.created_at, max_age: {crit: 8d}}
    inv_ids: [gen-artifact]
