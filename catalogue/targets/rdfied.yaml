id: rdfied
name: RDFied SPARQL endpoint
group: Nanosafety and RDF
class: data
criticality: low
owners: [egonw, ammar257ammar]
depends_on: [swarm]
public: true
public_summary: RDFied nanomaterial datasets with the eNanoMapper, BAO and NPO ontologies; on the cluster network only until its public name exists.
links: []
notes: >-
  Runs on the cluster overlay network with no public route yet; the planned public name
  has no DNS record. Ammar Ammar (original author) is listed for information only.
checks:
  - id: rdfied-dns
    kind: dns
    every: 1h
    describe: The planned public name resolves to tgx1 through two public resolvers.
    purpose: The planned address must point at our servers before RDFied goes public.
    request: {name: rdfied.rdf.bigcat-bioinformatics.org, resolvers: [1.1.1.1, 9.9.9.9]}
    assert:
      - {that: nxdomain, eq: false, label: "an explicit DNS record exists (the *.rdf names are not covered by the wildcard)"}
      - {that: node, eq: tgx1}
    inv_ids: [rdfied-dns]

  - id: rdfied-graphs
    kind: sparql
    every: 1h
    via: [core]
    public: false
    describe: The four RDFied graphs hold the triples migrated from the original host.
    purpose: Catches parts of the RDFied data going missing.
    request:
      endpoint: "http://rdfied:8890/sparql"
      file: q/rdf-portals-legacy/rdfied-graphs.rq
      pivot: {key: k, value: n}
    assert:
      - {that: status, eq: 200}
      - {that: by.enm, eq: 162025}
      - {that: by.bao, eq: 104026}
      - {that: by.npo, eq: 38719}
      - {that: by.rdfied, eq: 13169}
    inv_ids: [rdfied-internal-sparql]

  - id: rdfied-replicas
    kind: swarm
    every: 5m
    via: [core]
    public: false
    describe: The all-in-one Virtuoso service runs its one replica.
    purpose: Shows the RDFied database is running.
    request: {check: replicas, services: ["rdfied_*"]}
    assert:
      - {that: checked, eq: 1}
      - {that: not_converged_count, eq: 0}
    inv_ids: [rdfied-swarm-replicas]
