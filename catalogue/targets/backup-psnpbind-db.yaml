id: backup-psnpbind-db
name: PSnpBind database backup
group: Jobs and backups
class: backup
criticality: medium
owners: [egonw, marvinm2, ammar257ammar]
depends_on: [swarm]
public: false
public_summary: The PSnpBind database is backed up off the cluster.
# psnpbind_psnpbind-mysql has no scheduled dump. The check expects a nightly dump
# copied to the off-cluster drive under psnpbind/.
checks:
  - id: bk-psnpbind-exists
    kind: file_age
    every: 1h
    via: [core]
    describe: A dump of the PSnpBind database less than 26 hours old exists off the cluster.
    request: {mount: hidrive, glob: "psnpbind/*.sql.gz", small_bytes: 10000}
    assert:
      - {that: count, gte: 1, label: "a backup exists"}
      - {that: newest_age_h, lt: 26}
      - {that: gzip_ok, eq: true}
      - {that: small_count, eq: 0}
    inv_ids: []
