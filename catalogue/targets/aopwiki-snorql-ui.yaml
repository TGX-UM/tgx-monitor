id: aopwiki-snorql-ui
name: AOP-Wiki RDF Explorer (SNORQL UI)
group: AOP-Wiki RDF
class: service
criticality: high
owners: [marvinm2, egonw]
depends_on: [edge-tgx1, aopwiki-sparql, github-raw]
maintenance: [aopwiki-reload]
public: true
public_summary: The browser front end for the AOP-Wiki RDF endpoint, with ready-made example queries.
links:
  - https://aopwiki.rdf.bigcat-bioinformatics.org/
  - https://aopwiki-rdf.vhp4safety.nl/
checks:
  - id: aopwiki-ui-home
    kind: http
    every: 5m
    via: [public, tgx1, tgx2]
    describe: The explorer page loads with its title, through public DNS and on each node.
    purpose: Shows that people can open the AOP-Wiki RDF Explorer.
    request: {url: "https://aopwiki.rdf.bigcat-bioinformatics.org/"}
    assert:
      - {that: status, eq: 200}
      - {that: body, contains: "<title>AOP-Wiki RDF Explorer</title>"}
      - {that: latency_ms, lt: 3000, warn: true}
    inv_ids: [ui-presence]

  - id: aopwiki-ui-alias
    kind: http
    every: 15m
    describe: The explorer also loads under its VHP4Safety name.
    purpose: Many links use the VHP4Safety address for the explorer; those must keep working.
    request: {url: "https://aopwiki-rdf.vhp4safety.nl/"}
    assert:
      - {that: status, eq: 200}
      - {that: body, contains: "<title>AOP-Wiki RDF Explorer</title>"}
    inv_ids: [ui-presence]

  - id: aopwiki-ui-alias-redirect
    kind: http
    every: 1d
    describe: Plain http on the VHP4Safety name redirects permanently to https.
    purpose: Makes old or typed http links to the VHP4Safety address land on the secure explorer.
    request: {url: "http://aopwiki-rdf.vhp4safety.nl/", follow: false}
    assert:
      - {that: status, in: [301, 308]}
      - {that: headers.location, matches: '^https://aopwiki-rdf\.vhp4safety\.nl/'}
    inv_ids: [ui-presence]

  - id: aopwiki-ui-config
    kind: http
    every: 1h
    describe: The explorer's configuration points at the AOP-Wiki endpoint and the example query repository, so an image update did not lose its settings.
    purpose: An update can reset the explorer's settings, leaving it pointed at the wrong data or without examples.
    request: {url: "https://aopwiki.rdf.bigcat-bioinformatics.org/assets/js/config.js"}
    assert:
      - {that: status, eq: 200}
      - {that: body, contains: 'endpoint: "https://aopwiki.rdf.bigcat-bioinformatics.org/sparql"'}
      - {that: body, contains: 'examplesRepo: "https://github.com/marvinm2/AOP-Wiki-Queries"'}
      - {that: body, contains: 'examplesBranch: "main"'}
      - {that: body, contains: 'examplesFormat: "index"', label: "examples come from the published index (since 2026-11-12)"}
    inv_ids: [ui-config]

  - id: aopwiki-ui-examples-tree
    kind: compare
    every: 1d
    describe: The examples index the explorer reads (examples-index branch of AOP-Wiki-Queries) still lists at least 40 queries.
    purpose: Catches the example queries disappearing, which users rely on to get started.
    request:
      left:
        http_list:
          url: "https://raw.githubusercontent.com/marvinm2/AOP-Wiki-Queries/examples-index/index.json"
          re: '"id":\s*"(AOPQ[0-9]+)"'
          pick: all
        on_error: unknown
      right: {const: 40}
    assert:
      - {that: left, len_gte: 40, label: "≥ 40 examples in the index"}
    inv_ids: [ui-examples-tree]

  - id: aopwiki-ui-example-count-aops
    kind: roundtrip
    every: 1h
    describe: The "count AOPs" example (AOPQ001, as published in the examples index) gives the same number as a direct count.
    purpose: Runs an example the way a user would and checks the answer, so examples don't silently give wrong numbers.
    request:
      steps:
        - url: "https://raw.githubusercontent.com/marvinm2/AOP-Wiki-Queries/examples-index/rq/A.%20Metadata/count-aops.rq"
          capture: {q: {regex: '(?s)(.+)'}}
        - url: "https://aopwiki.rdf.bigcat-bioinformatics.org/sparql"
          params: {query: "{q}"}
          headers: {Accept: application/sparql-results+json}
        - url: "https://aopwiki.rdf.bigcat-bioinformatics.org/sparql"
          params: {query: "SELECT (COUNT(DISTINCT ?a) AS ?n) FROM <http://aopwiki.org/> WHERE { ?a a <http://aopkb.org/aop_ontology#AdverseOutcomePathway> }"}
          headers: {Accept: application/sparql-results+json}
    assert:
      - {that: completed, eq: true}
      - {that: steps.0.status, eq: 200, label: "example query file is reachable"}
      - {that: steps.1.status, eq: 200, label: "example query runs"}
      - {that: steps.1.json.results.bindings.0.total_AOPs.value, gte: 590, label: "example counts ≥ 590 AOPs"}
      - {that: steps.1.json.results.bindings.0.total_AOPs.value, eq_path: steps.2.json.results.bindings.0.n.value, label: "example count == direct count"}
    inv_ids: [ui-example-roundtrip, aopwiki-sparql-canaries]
