id: dns-records
name: Public DNS for the cluster's names and zones
group: Cluster
class: infra
criticality: high
owners: [egonw, marvinm2]
depends_on: []
public: true
public_summary: The public names of the department services point at the cluster, and their zones are delegated and signed as expected.
links: []
notes: >-
  Only Egon can change these zones: vhp4safety.nl, bigcat-bioinformatics.org, bridgedb.org
  and r-odaf.nl are on Strato DNS, wikipathways.org on Cloudflare, nsdra.org and
  psnpbind.org on Namecheap. Every routed name must resolve to tgx1 (the panel allows one
  A record, so there is no automatic failover). Known exceptions, checked in their own
  targets: toxtempassistant.vhp4safety.nl (still the old VHP-1 host) and rdf.wikipathways.org
  (Cloudflare). Names whose own target already has a dns check are not repeated here; the
  bigcat-bioinformatics.org delegation is checked in bigcat-domain-dns.
checks:

  - id: dns-aopsuite
    kind: dns
    every: 1h
    describe: aopsuite.cloud.vhp4safety.nl resolves to tgx1 through two public resolvers, and they agree.
    request: {name: aopsuite.cloud.vhp4safety.nl, resolvers: [1.1.1.1, 9.9.9.9]}
    assert:
      - {that: node, eq: tgx1}
      - {that: consistent, eq: true, warn: true}
    inv_ids: [dns-a-to-tgx1]

