  - id: dns-dnssec-vhp4safety-nl
    kind: dns
    every: 6h
    describe: The signed zone vhp4safety.nl validates (expired signatures would make every name in it fail to resolve).
    request: {name: vhp4safety.nl, resolvers: [1.1.1.1]}
    assert:
      - {that: ad, eq: true}
      - {that: nxdomain, eq: false}
    inv_ids: [dns-dnssec]

  - id: dns-dnssec-r-odaf-nl
