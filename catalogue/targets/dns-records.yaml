    kind: dns
    every: 1d
    describe: The bigcat-bioinformatics.org wildcard still points at tgx1, so names that rely on it reach the cluster.
    request: {name: bigcat-bioinformatics.org, resolvers: [1.1.1.1], wildcard_probe: bigcat-bioinformatics.org}
    assert:
      - {that: wildcard_answers, has: 81.169.246.233}
    inv_ids: [dns-wildcards]

  - id: dns-ns-vhp4safety-nl
    kind: dns
    every: 1d
    describe: vhp4safety.nl is still delegated to its Strato nameservers.
    request: {name: vhp4safety.nl, type: NS, resolvers: [1.1.1.1, 9.9.9.9]}
    assert:
      - {that: answers, eq: [ns3.stratoserver.net, ns4.stratoserver.net]}
    inv_ids: [dns-ns-delegation]

