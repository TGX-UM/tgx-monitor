  - id: dns-wildcard-vhp4safety-nl
    kind: dns
    every: 1d
    describe: "The wildcard under vhp4safety.nl is as recorded (present): GitHub Pages catches every unlisted name, so a new service without its own record silently fails its certificate."
    request: {name: vhp4safety.nl, resolvers: [1.1.1.1], wildcard_probe: vhp4safety.nl}
    assert:
      - {that: wildcard, eq: true}
    inv_ids: [dns-wildcards]

  - id: dns-wildcard-cloud-vhp4safety-nl
    kind: dns
    every: 1d
    describe: "The wildcard under cloud.vhp4safety.nl is as recorded (absent): no wildcard: every cloud.vhp4safety.nl service needs its own record."
    request: {name: cloud.vhp4safety.nl, resolvers: [1.1.1.1], wildcard_probe: cloud.vhp4safety.nl}
    assert:
      - {that: wildcard, eq: false}
    inv_ids: [dns-wildcards]

  - id: dns-wildcard-bigcat-bioinformatics-org
    kind: dns
    every: 1d
    describe: "The wildcard under bigcat-bioinformatics.org is as recorded (present): every unlisted name reaches the cluster."
    request: {name: bigcat-bioinformatics.org, resolvers: [1.1.1.1], wildcard_probe: bigcat-bioinformatics.org}
    assert:
      - {that: wildcard, eq: true}
    inv_ids: [dns-wildcards]

  - id: dns-wildcard-rdf-bigcat-bioinformatics-org
    kind: dns
    every: 1d
    describe: "The wildcard under rdf.bigcat-bioinformatics.org is as recorded (absent): no wildcard under rdf.."
    request: {name: rdf.bigcat-bioinformatics.org, resolvers: [1.1.1.1], wildcard_probe: rdf.bigcat-bioinformatics.org}
