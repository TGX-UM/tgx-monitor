id: bridgedb-data-catalogue
name: BridgeDb mapping-file catalogue
group: BridgeDb
class: data
criticality: medium
owners: [egonw, tabbassidaloii, danidi, marvinm2, youphendriks]
public_summary: The data.bridgedb.org catalogue of mapping databases (gene.json, other.json and their build configs), which both people and the BridgeDb image build download from.
links:
  - https://data.bridgedb.org/gene.json
  - https://data.bridgedb.org/other.json
  - https://data.bridgedb.org/gene_database/
notes: >-
  GitHub Pages of bridgedb/data. Strict schema validation fails on long-standing defects,
  so the shape checks allowlist them exactly (Xenopus tropicalis date '2025-021-31',
  Oryza indica without speciesID, Solanum tuberosum with an empty QC report, no QC report
  for Bacillus subtilis, E. coli and M. tuberculosis) and fail on anything new.
checks:
  - id: bridgedb-catalogue-gene-json
    kind: http
    every: 1d
    describe: gene.json is valid JSON listing at least 36 organism databases with the required fields, at least 34 webservice-tested, and no date defects beyond the known one.
    purpose: People and the BridgeDb build download mapping files from this list; if it breaks, organisms go missing.
    request: {url: "https://data.bridgedb.org/gene.json", parse_json: true}
    assert:
      - {that: status, eq: 200}
      - {that: headers.content-type, contains: application/json}
      - {that: json.mappingFiles, len_gte: 36}
      - {that: body, matches: '(?s)(?:"species"\s*:.*?){36}', label: "≥ 36 entries with species"}
      - {that: body, matches: '(?s)(?:"file"\s*:.*?){36}', label: "≥ 36 entries with file"}
      - {that: body, matches: '(?s)(?:"downloadURL"\s*:.*?){36}', label: "≥ 36 entries with downloadURL"}
      - {that: body, matches: '(?s)(?:"doi"\s*:.*?){36}', label: "≥ 36 entries with doi"}
      - {that: body, matches: '(?s)(?:"license"\s*:.*?){36}', label: "≥ 36 entries with license"}
      - {that: body, matches: '(?s)(?:"size"\s*:.*?){36}', label: "≥ 36 entries with size"}
      - {that: body, matches: '(?s)(?:"speciesID"\s*:.*?){35}', label: "≥ 35 entries with speciesID (Oryza indica known to lack it)"}
      - {that: body, matches: '(?s)(?:"date":\s*"\d{4}-\d{2}-\d{2}".*?){35}', label: "≥ 35 ISO dates"}
      - {that: body, not_matches: '"date":\s*"(?!\d{4}-\d{2}-\d{2}"|2025-021-31")', label: "no malformed date beyond the known Xenopus one"}
      - {that: body, matches: '(?s)(?:"WS".*?){34}', label: "≥ 34 entries webservice-tested"}
      - {that: body, matches: '(?s)(?:"QCreport":\s*"https?://.*?){32}', label: "≥ 32 entries with a QC report"}
    inv_ids: [bridgedb-catalogue-gene-json-shape]
  - id: bridgedb-catalogue-other-json
    kind: http
    every: 1d
    describe: other.json lists the six shared databases (complexes, genes, interactions, metabolites, pathways, publications), each with a DOI and download link.
    purpose: The shared metabolite, pathway and other mapping files are found through this list.
    request: {url: "https://data.bridgedb.org/other.json", parse_json: true}
    assert:
      - {that: status, eq: 200}
      - {that: json.mappingFiles, len_gte: 6}
      - {that: body, matches: '"type":\s*"Complexes"'}
      - {that: body, matches: '"type":\s*"Genes"'}
      - {that: body, matches: '"type":\s*"Interactions"'}
      - {that: body, matches: '"type":\s*"Metabolites"'}
      - {that: body, matches: '"type":\s*"Pathways"'}
      - {that: body, matches: '"type":\s*"Publications"'}
      - {that: body, matches: '(?s)(?:"doi"\s*:.*?){6}', label: "every entry has a doi"}
      - {that: body, matches: '(?s)(?:"downloadURL"\s*:.*?){6}', label: "every entry has a downloadURL"}
    inv_ids: [bridgedb-catalogue-other-json]
  - id: bridgedb-catalogue-metabolite-served
    kind: compare
    every: 1d
    describe: The metabolite database listed in other.json is the one the webservice serves.
    purpose: Makes sure the metabolite mappings people can download are the same ones the webservice uses.
    request:
      left: {http_regex: {url: "https://data.bridgedb.org/other.json", re: 'metabolites_(\d{8})\.bridge'}}
      right: {http_regex: {url: "https://webservice.bridgedb.org/Human/properties", re: 'HMDB-CHEBI-WIKIDATA\s+BUILDDATE\t(\d{8})'}}
    assert:
      - {that: equal, eq: true, label: "other.json metabolites file date == served metabolite BUILDDATE"}
    inv_ids: [bridgedb-catalogue-other-json]
  - id: bridgedb-catalogue-config-species
    kind: invariant
    every: 1d
    describe: gene.json.config, which the image build reads, lists exactly the species in gene.json.
    purpose: The BridgeDb build reads this file; if it disagrees with the catalogue, an organism can silently drop out.
    request:
      left: {http_list: {url: "https://data.bridgedb.org/gene.json", re: '"species":\s*"([^"]+)"', pick: all}}
      right: {http_list: {url: "https://data.bridgedb.org/gene.json.config", re: '^([^\t\n]+)\t', pick: all}}
    assert:
      - {that: equal, eq: true}
      - {that: right, len_gte: 36}
    inv_ids: [bridgedb-catalogue-build-inputs]
  - id: bridgedb-catalogue-config-files
    kind: invariant
    every: 1d
    describe: gene.json.config names exactly the database files listed in gene.json.
    purpose: The BridgeDb build reads this file; a mismatch means it fetches the wrong or no mapping file.
    request:
      left: {http_list: {url: "https://data.bridgedb.org/gene.json", re: '"file":\s*"([^"]+)"', pick: all}}
      right: {http_list: {url: "https://data.bridgedb.org/gene.json.config", re: '\t(\S+)\s*$', pick: all}}
    assert:
      - {that: equal, eq: true}
    inv_ids: [bridgedb-catalogue-build-inputs]
  - id: bridgedb-catalogue-other-config
    kind: invariant
    every: 1d
    describe: other.json.config names exactly the six shared database files listed in other.json.
    purpose: The BridgeDb build reads this file; a mismatch means a shared mapping file is left out.
    request:
      left: {http_list: {url: "https://data.bridgedb.org/other.json", re: '"file":\s*"([^"]+)"', pick: all}}
      right: {http_list: {url: "https://data.bridgedb.org/other.json.config", re: '^\*\t(\S+)', pick: all}}
    assert:
      - {that: equal, eq: true}
      - {that: right, len_eq: 6}
    inv_ids: [bridgedb-catalogue-build-inputs]
  - id: bridgedb-catalogue-corona
    kind: roundtrip
    every: 1d
    describe: The coronavirus catalogue and its build config, also read by the image build, are published and agree on the file.
    purpose: Coronavirus mappings come from this list; if it breaks, they disappear from the webservice.
    request:
      base: https://data.bridgedb.org
      steps:
        - {url: "/corona.json", capture: {file: {regex: '"file":\s*"([^"]+)"'}}}
        - {url: "/corona.json.config", capture: {config: {regex: '^\*\t(\S+)'}}}
    assert:
      - {that: steps.0.status, eq: 200}
      - {that: steps.1.status, eq: 200}
      - {that: captures.config, eq_path: captures.file}
    inv_ids: [bridgedb-catalogue-build-inputs]
  - id: bridgedb-catalogue-downloads
    kind: roundtrip
    every: 7d
    timeout: 60s
    describe: Mapping files download through the figshare download host the image build uses; the catalogue's own links answering with a bot challenge shows amber.
    purpose: The BridgeDb build downloads the mapping files from here; if downloads fail, the build fails.
    request:
      steps:
        - {method: HEAD, url: "https://ndownloader.figshare.com/files/64770111", follow: false, capture: {gene: {header: location}}}
        - {method: HEAD, url: "https://ndownloader.figshare.com/files/60760156", follow: false, capture: {metabolites: {header: location}}}
        - {method: HEAD, url: "https://figshare.com/ndownloader/files/64770111", follow: false, capture: {waf: {header: x-amzn-waf-action}}}
    assert:
      - {that: steps.0.status, eq: 302}
      - {that: captures.gene, matches: '^https://', label: "gene database redirects to object storage"}
      - {that: steps.1.status, eq: 302}
      - {that: captures.metabolites, matches: '^https://', label: "metabolite database redirects to object storage"}
      - {that: captures.waf, absent: true, warn: true, label: "catalogue download links work for scripts (figshare.com/ndownloader answers a bot challenge)"}
    inv_ids: [bridgedb-catalogue-download-reachability]
  - id: bridgedb-catalogue-dois
    kind: roundtrip
    every: 7d
    timeout: 2m
    describe: Every Zenodo and figshare record the catalogue cites is published and still holds its mapping database file.
    purpose: The catalogue links to permanent archive copies; this catches a removed or empty record.
    request:
      steps:
        - url: "https://zenodo.org/api/records/14779056"
          capture: {z14779056: {regex: '"status":\s*"(\w+)"'}, z14779056_file: {regex: '"key":\s*"([^"]+\.bridge)"'}}
        - url: "https://zenodo.org/api/records/14779268"
          capture: {z14779268: {regex: '"status":\s*"(\w+)"'}, z14779268_file: {regex: '"key":\s*"([^"]+\.bridge)"'}}
        - url: "https://zenodo.org/api/records/14779316"
          capture: {z14779316: {regex: '"status":\s*"(\w+)"'}, z14779316_file: {regex: '"key":\s*"([^"]+\.bridge)"'}}
        - url: "https://zenodo.org/api/records/14779363"
          capture: {z14779363: {regex: '"status":\s*"(\w+)"'}, z14779363_file: {regex: '"key":\s*"([^"]+\.bridge)"'}}
        - url: "https://zenodo.org/api/records/3667670"
          capture: {z3667670: {regex: '"status":\s*"(\w+)"'}, z3667670_file: {regex: '"key":\s*"([^"]+\.bridge)"'}}
        - url: "https://zenodo.org/api/records/5638771"
          capture: {z5638771: {regex: '"status":\s*"(\w+)"'}, z5638771_file: {regex: '"key":\s*"([^"]+\.bridge)"'}}
        - url: "https://zenodo.org/api/records/5773822"
          capture: {z5773822: {regex: '"status":\s*"(\w+)"'}, z5773822_file: {regex: '"key":\s*"([^"]+\.bridge)"'}}
        - url: "https://zenodo.org/api/records/7625357"
          capture: {z7625357: {regex: '"status":\s*"(\w+)"'}, z7625357_file: {regex: '"key":\s*"([^"]+\.bridge)"'}}
        - url: "https://zenodo.org/api/records/7902769"
          capture: {z7902769: {regex: '"status":\s*"(\w+)"'}, z7902769_file: {regex: '"key":\s*"([^"]+\.bridge)"'}}
        - url: "https://zenodo.org/api/records/5734440"
          capture: {z5734440: {regex: '"status":\s*"(\w+)"'}, z5734440_file: {regex: '"key":\s*"([^"]+\.bridge)"'}}
        - {url: "https://api.figshare.com/v2/articles/13551176", capture: {f13551176: {regex: '"name":\s*"([^"]+\.bridge)"'}}}
        - {url: "https://api.figshare.com/v2/articles/22720564", capture: {f22720564: {regex: '"name":\s*"([^"]+\.bridge)"'}}}
        - {url: "https://api.figshare.com/v2/articles/30993322", capture: {f30993322: {regex: '"name":\s*"([^"]+\.bridge)"'}}}
    assert:
      - {that: captures.z14779056, eq: published, label: "Zenodo 14779056 (Ensembl 111) published"}
      - {that: captures.z14779056_file, exists: true}
      - {that: captures.z14779268, eq: published, label: "Zenodo 14779268 (Ensembl Plants 56) published"}
      - {that: captures.z14779268_file, exists: true}
      - {that: captures.z14779316, eq: published, label: "Zenodo 14779316 (Ensembl Fungi 56) published"}
      - {that: captures.z14779316_file, exists: true}
      - {that: captures.z14779363, eq: published, label: "Zenodo 14779363 (Ensembl Metazoa 56) published"}
      - {that: captures.z14779363_file, exists: true}
      - {that: captures.z3667670, eq: published, label: "Zenodo 3667670 (Ensembl 91) published"}
      - {that: captures.z3667670_file, exists: true}
      - {that: captures.z5638771, eq: published, label: "Zenodo 5638771 (Ensembl 85) published"}
      - {that: captures.z5638771_file, exists: true}
      - {that: captures.z5773822, eq: published, label: "Zenodo 5773822 (pathways) published"}
      - {that: captures.z5773822_file, eq: pathways_20211211.bridge}
      - {that: captures.z7625357, eq: published, label: "Zenodo 7625357 (complexes) published"}
      - {that: captures.z7625357_file, eq: complexes-2023-02-09.bridge}
      - {that: captures.z7902769, eq: published, label: "Zenodo 7902769 (Wikidata genes) published"}
      - {that: captures.z7902769_file, eq: genes_20230506.bridge}
      - {that: captures.z5734440, eq: published, label: "Zenodo 5734440 (human corona) published"}
      - {that: captures.z5734440_file, eq: humancorona-2021-11-27.bridge}
      - {that: captures.f13551176, eq: interactions20210109.bridge}
      - {that: captures.f22720564, eq: publications_20230428.bridge}
      - {that: captures.f30993322, eq: metabolites_20260102.bridge}
    inv_ids: [bridgedb-catalogue-doi-resolve]
  - id: bridgedb-catalogue-pages-workflow
    kind: gha
    every: 1d
    describe: The bridgedb/data workflow that generates the catalogue web pages last completed successfully.
    purpose: This job builds the catalogue web pages; if it fails, the pages go out of date.
    request: {repo: bridgedb/data, workflow: blank.yml}
    assert:
      - {that: state, eq: active}
      - {that: completed_conclusion, eq: success}
    inv_ids: [bridgedb-website-pages-build]
