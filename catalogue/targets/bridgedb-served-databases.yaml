      - {that: captures.aspergillus_niger, max_age: {warn: 1095d, crit: 3650d}, label: "Aspergillus niger: gene database loaded, built within 3 years"}
      - {that: captures.bacillus_subtilis, max_age: {crit: 3650d}, label: "Bacillus subtilis: gene database loaded (2018 Ensembl 91 build, allowlisted as old)"}
      - {that: captures.bos_taurus, max_age: {warn: 1095d, crit: 3650d}, label: "Bos taurus: gene database loaded, built within 3 years"}
      - {that: captures.caenorhabditis_elegans, max_age: {warn: 1095d, crit: 3650d}, label: "Caenorhabditis elegans: gene database loaded, built within 3 years"}
