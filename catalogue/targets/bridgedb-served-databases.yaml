id: bridgedb-served-databases
name: BridgeDb mapping databases as served
group: BridgeDb
class: data
criticality: medium
owners: [egonw, danidi, tabbassidaloii, DeniseSl22, marvinm2]
depends_on: [bridgedb-webservice]
public_summary: The per-organism gene and metabolite mapping databases that the BridgeDb webservice loads, their build dates, and whether the newest published releases are served.
links:
  - https://webservice.bridgedb.org/contents
  - https://webservice.bridgedb.org/Human/properties
  - https://data.bridgedb.org/gene.json
notes: >-
  The databases are baked into the image, so data changes only with an image rebuild and
  a service update. The served organism set is gene.json's WS-tested species minus
  Fusarium graminearum, which is published but cannot be parsed at runtime (allowlisted).
checks:
  - id: bridgedb-db-served-vs-catalogue
    kind: invariant
    every: 1d
    describe: The organisms the webservice serves are exactly the webservice-tested species in the data.bridgedb.org catalogue (Fusarium graminearum allowlisted as unparseable).
    request:
      left: {http_list: {url: "https://webservice.bridgedb.org/contents", re: '^[^\t\n]*\t([^\t\r\n]+)', pick: all}}
      right: {http_list: {url: "https://data.bridgedb.org/gene.json", re: '"species":\s*"(?!Fusarium graminearum")([^"]+)"[^}]*"WS"', pick: all}}
    assert:
      - {that: equal, eq: true, label: "served organisms == WS-tested catalogue species"}
      - {that: left, len_gte: 33}
      - {that: left, has: Homo sapiens}
    inv_ids: [bridgedb-served-contents-vs-catalogue]
  - id: bridgedb-db-build-dates
    kind: roundtrip
    every: 1d
    timeout: 3m
    describe: Every served organism has a gene database with a readable build date, none older than three years (Bacillus subtilis allowlisted at its 2018 build).
    request:
      base: https://webservice.bridgedb.org
      steps:
