        - {url: "/Daphnia%20magna/properties", capture: {daphnia_magna: {regex: 'DATASOURCENAME\tEnsembl\w*\s+BUILDDATE\t(\d{8})'}}}
        - {url: "/Daphnia%20pulex/properties", capture: {daphnia_pulex: {regex: 'DATASOURCENAME\tEnsembl\w*\s+BUILDDATE\t(\d{8})'}}}
        - {url: "/Drosophila%20melanogaster/properties", capture: {drosophila_melanogaster: {regex: 'DATASOURCENAME\tEnsembl\w*\s+BUILDDATE\t(\d{8})'}}}
