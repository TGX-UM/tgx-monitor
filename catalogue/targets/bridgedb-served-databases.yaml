      - {that: captures.daphnia_pulex, max_age: {warn: 1095d, crit: 3650d}, label: "Daphnia pulex: gene database loaded, built within 3 years"}
      - {that: captures.drosophila_melanogaster, max_age: {warn: 1095d, crit: 3650d}, label: "Drosophila melanogaster: gene database loaded, built within 3 years"}
      - {that: captures.equus_caballus, max_age: {warn: 1095d, crit: 3650d}, label: "Equus caballus: gene database loaded, built within 3 years"}
      - {that: captures.gallus_gallus, max_age: {warn: 1095d, crit: 3650d}, label: "Gallus gallus: gene database loaded, built within 3 years"}
      - {that: captures.glycine_max, max_age: {warn: 1095d, crit: 3650d}, label: "Glycine max: gene database loaded, built within 3 years"}
      - {that: captures.homo_sapiens, max_age: {warn: 1095d, crit: 3650d}, label: "Homo sapiens: gene database loaded, built within 3 years"}
      - {that: captures.hordeum_vulgare, max_age: {warn: 1095d, crit: 3650d}, label: "Hordeum vulgare: gene database loaded, built within 3 years"}
      - {that: captures.macaca_mulatta, max_age: {warn: 1095d, crit: 3650d}, label: "Macaca mulatta: gene database loaded, built within 3 years"}
      - {that: captures.mus_musculus, max_age: {warn: 1095d, crit: 3650d}, label: "Mus musculus: gene database loaded, built within 3 years"}
      - {that: captures.ornithorhynchus_anatinus, max_age: {warn: 1095d, crit: 3650d}, label: "Ornithorhynchus anatinus: gene database loaded, built within 3 years"}
      - {that: captures.oryza_indica, max_age: {warn: 1095d, crit: 3650d}, label: "Oryza indica: gene database loaded, built within 3 years"}
      - {that: captures.oryza_japonica, max_age: {warn: 1095d, crit: 3650d}, label: "Oryza japonica: gene database loaded, built within 3 years"}
