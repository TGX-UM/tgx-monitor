  - id: bridgedb-db-human-properties
    kind: http
    every: 1d
    describe: The human organism loads all eight databases (Ensembl genes, corona, complexes, Wikidata genes, interactions, metabolites, pathways, publications); the AOP-Wiki RDF records this in its metadata.
    request: {url: "https://webservice.bridgedb.org/Human/properties"}
    assert:
      - {that: status, eq: 200}
      - {that: body, matches: '(?s)(?:DATASOURCENAME.*?){8}', label: "≥ 8 database blocks"}
      - {that: body, matches: "^DATASOURCENAME\tEnsembl\nBUILDDATE\t\\d{8}\nSERIES\tHomo sapiens genes and proteins$", label: "Ensembl human genes"}
      - {that: body, matches: "^DATASOURCENAME\tWikidata\nBUILDDATE\t\\d{8}\nSERIES\tHomo sapiens genes and proteins$", label: "Wikidata human genes"}
      - {that: body, matches: "^SERIES\thumancorona$"}
      - {that: body, matches: "^SERIES\tComplexes$"}
      - {that: body, matches: "^SERIES\tstandard-interaction$"}
      - {that: body, matches: "^DATASOURCENAME\tHMDB-CHEBI-WIKIDATA$", label: "metabolites"}
      - {that: body, matches: "^SERIES\tpathways$"}
      - {that: body, matches: "^SERIES\tpublications$"}
      - {that: body, matches: "^DATASOURCEVERSION\t111$", warn: true, label: "Ensembl 111 still served (re-baseline when 115 is promoted)"}
    inv_ids: [bridgedb-served-human-properties]
  - id: bridgedb-db-metabolite-freshness
    kind: roundtrip
    every: 1d
    severity: low
    alert_after: 21d
    describe: The served metabolite database is the newest one published on figshare, allowing three weeks for a new release to be deployed, and is under a year old.
    request:
      steps:
        - {url: "https://webservice.bridgedb.org/Human/properties", capture: {served: {regex: 'HMDB-CHEBI-WIKIDATA\s+BUILDDATE\t(\d{8})'}}}
        - method: POST
          url: "https://api.figshare.com/v2/articles/search"
          json: {search_for: "Metabolite BridgeDb ID Mapping Database", page_size: 5, order: published_date, order_direction: desc}
          capture: {published: {regex: 'Metabolite BridgeDb ID Mapping Database \((\d{8})\)'}}
    assert:
      - {that: captures.served, eq_path: captures.published, label: "served metabolite build == newest figshare release"}
      - {that: captures.served, max_age: {warn: 365d}}
    inv_ids: [bridgedb-served-metabolite-freshness]
  - id: bridgedb-db-gene-freshness
    kind: compare
    every: 1d
    describe: The served human Ensembl release is not behind any Zenodo gene-database deposit older than 45 days (the reload window); a newer, younger deposit shows amber.
    request:
      left: {http_regex: {url: "https://webservice.bridgedb.org/Human/properties", re: "DATASOURCENAME\tEnsembl\\s+BUILDDATE\t\\d+\\s+SERIES\tHomo sapiens genes and proteins\\s+DATATYPE\t\\S+\\s+DATASOURCEVERSION\t(\\d+)"}}
      right:
        http_list:
          url: "https://zenodo.org/api/records"
          params: {q: 'title:"Gene/Protein BridgeDb ID Mapping Database" AND NOT title:(Plants OR Metazoa OR Fungi) AND created:[* TO now-45d]', sort: mostrecent, size: "25"}
          re: '"version":\s*"(?:Version )?(\d+)"'
          pick: newest
        on_error: unknown
      sources:
        upstream:
          http_list:
            url: "https://zenodo.org/api/records"
            params: {q: 'title:"Gene/Protein BridgeDb ID Mapping Database" AND NOT title:(Plants OR Metazoa OR Fungi)', sort: mostrecent, size: "25"}
            re: '"version":\s*"(?:Version )?(\d+)"'
            pick: newest
          on_error: unknown
    assert:
      - {that: relation, in: [equal, left_newer], label: "served Ensembl ≥ every deposit older than 45 days"}
      - {that: left, eq_path: upstream, warn: true, label: "the newest Ensembl deposit is served"}
    inv_ids: [bridgedb-served-gene-freshness]
