        - {url: "/Solanum%20lycopersicum/properties", capture: {solanum_lycopersicum: {regex: 'DATASOURCENAME\tEnsembl\w*\s+BUILDDATE\t(\d{8})'}}}
        - {url: "/Solanum%20tuberosum/properties", capture: {solanum_tuberosum: {regex: 'DATASOURCENAME\tEnsembl\w*\s+BUILDDATE\t(\d{8})'}}}
        - {url: "/Sus%20scrofa/properties", capture: {sus_scrofa: {regex: 'DATASOURCENAME\tEnsembl\w*\s+BUILDDATE\t(\d{8})'}}}
