id: toxtempassistant-swarm
name: ToxTempAssistant swarm stack (not yet live)
group: VHP4Safety tools
class: service
criticality: low
owners: [johannehouweling, mmarras, egonw, marvinm2]
depends_on: [edge-tgx1]
# Internal: the swarm copy serves no users until the DNS cutover, and its checks name
# internal service names.
public: false
public_summary: The cluster copy of ToxTempAssistant, waiting for the DNS cutover.
links: []
checks:
  - id: toxtemp-swarm-root
    kind: http
    every: 15m
    via: [tgx1, tgx2]
    describe: The cluster copy of the app answers on each node with a release number (its certificate is not trusted yet, so it is not verified here).
    request: {url: "https://toxtempassistant.vhp4safety.nl/", verify: false}
    assert:
      - {that: status, eq: 200}
      - {that: body, matches: 'v\d+\.\d+\.\d+'}
      - {that: size, gt: 30000}
    inv_ids: [toxtemp-swarm-instance]

  - id: toxtemp-swarm-version
    kind: compare
    every: 6h
    via: [core]
    alert_after: 24h
    describe: The cluster copy runs the same release as the public site.
    request:
      left: {http_regex: {url: "https://toxtempassistant.vhp4safety.nl/", re: '(v\d+\.\d+\.\d+)'}}
      right:
        http_regex:
          url: "http://toxtempass_djangoapp:8000/"
          re: '(v\d+\.\d+\.\d+)'
          headers: {Host: toxtempassistant.vhp4safety.nl, X-Forwarded-Proto: https}
        on_error: unknown
    assert:
      - {that: left, eq_path: right}
    inv_ids: [toxtemp-version-parity]

  - id: toxtemp-dns
    kind: dns
    every: 1h
    describe: The public name points at the cluster (tgx1), agreed by two public resolvers.
    request: {name: toxtempassistant.vhp4safety.nl, resolvers: [1.1.1.1, 9.9.9.9]}
    assert:
      - {that: consistent, eq: true}
      - {that: node, eq: tgx1, label: DNS cutover to the cluster done}
    inv_ids: [toxtemp-dns-target]

  - id: toxtemp-swarm-cert
    kind: tls
    every: 1d
    via: [tgx1, tgx2]
    describe: Both nodes serve a trusted certificate for the name, not the proxy's self-signed default (the certificate request fails while DNS points elsewhere).
    request: {host: toxtempassistant.vhp4safety.nl}
    assert:
      - {that: is_traefik_default, eq: false}
      - {that: verified, eq: true}
    inv_ids: [toxtemp-acme-loop]

  - id: toxtemp-swarm-replicas
    kind: swarm
    every: 5m
    via: [core]
    alert_after: 5m
    describe: Every long-running service of the stack has its replica running (the one-shot storage init job is left out).
    request: {check: replicas, services: ["toxtempass_*"], ignore: [toxtempass_minio_init]}
    assert:
      - {that: not_converged_count, eq: 0}
      - {that: checked, gte: 4}
    inv_ids: [toxtemp-stack-state]
