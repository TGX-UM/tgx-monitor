id: wikipathways-snorql
name: WikiPathways Snorql query UI
group: WikiPathways
class: service
criticality: medium
owners: [marvinm2, egonw]
depends_on: [edge-tgx1, wikipathways-sparql, github-raw]
public: true
public_summary: The browser query editor at sparql.wikipathways.org, with example queries loaded from the index published by the SPARQLQueries repository.
links: [https://sparql.wikipathways.org/]
notes: >-
  The example tree is fetched in the browser from the examples-index branch of wikipathways/SPARQLQueries on GitHub (index.json; the .rq files left master on 2026-11-11), so the
  examples depend on GitHub raw. The AOP-Wiki and nanosafety Snorql overlays build from the same
  snorql-ui base image, so a broken base image reaches them too. The known-answer query that the
  UI's "Genes of a Pathway" example runs is checked on the endpoint (wp-sparql-wp254).
checks:
  - id: snorql-page
    kind: http
    every: 15m
    via: [public, tgx1, tgx2]
    describe: The query UI page loads with its configuration script, through public DNS and on each node.
    purpose: Shows that people can open the WikiPathways query editor.
    request: {url: "https://sparql.wikipathways.org/", headers: {Accept: text/html}}
    assert:
      - {that: status, eq: 200}
      - {that: headers.content-type, contains: text/html}
      - {that: body, contains: "<title>WikiPathways SNORQL</title>"}
      - {that: body, contains: "assets/js/config.js"}
    inv_ids: [snorql-page]

  - id: snorql-config
    kind: http
    every: 1h
    describe: The UI is configured for the WikiPathways endpoint and the SPARQLQueries example repository.
    purpose: An update can reset the editor's settings, pointing it at the wrong data or losing its examples.
    request: {url: "https://sparql.wikipathways.org/assets/js/config.js"}
    assert:
      - {that: status, eq: 200}
      - {that: body, contains: 'endpoint: "https://sparql.wikipathways.org/sparql/"'}
      - {that: body, contains: 'examplesRepo: "https://github.com/wikipathways/SPARQLQueries"'}
      - {that: body, contains: 'examplesBranch: "master"'}
      - {that: body, contains: 'examplesFormat: "index"', label: "examples come from the published index (since UI 1.4.0)"}
    inv_ids: [snorql-config]

  - id: snorql-examples-source
    kind: http
    every: 1h
    describe: The published example index the UI reads lists an example it deep-links to, with its parameter.
    purpose: The editor's example queries come from this list; if it disappears, users see no examples.
    request: {url: "https://raw.githubusercontent.com/wikipathways/SPARQLQueries/examples-index/index.json"}
    assert:
      - {that: status, eq: 200}
      - {that: body, contains: '"id": "WPQ036"'}
      - {that: body, contains: '"name": "pathwayId"'}
    inv_ids: [snorql-examples-source]

  - id: snorql-image
    kind: registry
    every: 1h
    via: [core]
    describe: The pinned UI image can be pulled from the registry, and both nodes have it.
    purpose: If the server running the editor fails, the other one needs a copy of it to take over.
    request: {image: "ghcr.io/wikipathways/snorql-ui:1.5.0"}
    assert:
      - {that: reachable, eq: true}
      - {that: missing_on_nodes, len_eq: 0}
    inv_ids: [snorql-image-drift]

  - id: snorql-image-drift
    kind: digest_drift
    every: 1h
    via: [core]
    severity: low
    describe: The UI service keeps running the image it was deployed with (a change is shown, for information).
    purpose: Tells us when the editor changed without a deliberate update.
    request: {services: [wikipathways_wikipathways-snorql]}
    assert:
      - {that: changed_count, eq: 0, warn: true}
      - {that: redeployed, len_eq: 0, warn: true}
    inv_ids: [snorql-image-drift]
