id: tls-certificates
name: TLS certificates on both nodes
group: Cluster
class: infra
criticality: high
owners: [marvinm2, egonw]
depends_on: [edge-tgx1, edge-tgx2]
public: true
public_summary: Every site on the cluster presents a valid certificate that is renewed well before it expires, on both nodes.
links: []
notes: >-
  The proxy renews Let's Encrypt certificates about 30 days before expiry, but its ACME
  account e-mail belongs to the admin who left, so nobody is told when a renewal keeps
  failing. These checks replace that mail: a renewal that fails shows as days_left falling
  under 21 (amber) and 10 (red). Each node's proxy keeps its own copy in memory, so the two
  can diverge (bridgedb.cloud: 72 days on tgx1, 32 on tgx2 on 2026-11-11); both are checked.
  Names whose own target already has a tls check are not repeated here.
checks:
  - id: tls-aopsuite
    kind: tls
    every: 1d
    via: [tgx1, tgx2]
    describe: Both nodes present a trusted certificate for aopsuite.cloud.vhp4safety.nl that covers the name and is not close to expiry.
    request: {host: aopsuite.cloud.vhp4safety.nl}
    assert:
      - {that: verified, eq: true}
      - {that: is_traefik_default, eq: false}
      - {that: covers_host, eq: true}
      - {that: days_left, gte: 21, warn: true}
      - {that: days_left, gte: 10}
    inv_ids: [tls-days-left, tls-not-default-and-san, tls-node-divergence]

