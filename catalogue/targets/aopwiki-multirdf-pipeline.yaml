id: aopwiki-multirdf-pipeline
name: AOP-Wiki multi-release quarterly pipeline and watchdogs (GitHub Actions)
group: Pipelines
class: pipeline
criticality: medium
owners: [marvinm2]
depends_on: [aopwiki-xml-upstream, aopwiki-multirdf]
public: true
public_summary: GitHub Actions look every week for a new quarterly AOP-Wiki release to add to the multi-release endpoint, and check that endpoint and the AOP-Wiki API every day or week.
links:
  - https://github.com/marvinm2/AOP-Wiki_multi-endpoint/actions
  - https://github.com/marvinm2/AOP-Wiki-API/actions
# quarterly-update (Mon 08:00) opens a PR "Add AOP-Wiki RDF quarter <date>" whose TTL
# artifact expires after 30 days; add-quarter.sh needs it, so the PR must not sit.
checks:
  - id: multirdf-quarterly-update
    kind: gha
    every: 1h
    describe: The weekly look for a new AOP-Wiki quarter ran within the past eight days and succeeded.
    request: {repo: marvinm2/AOP-Wiki_multi-endpoint, workflow: quarterly-update.yml}
    assert:
      - {that: state, eq: active}
      - {that: completed_conclusion, eq: success}
      - {that: last_success_at, max_age: {crit: 8d}}
    inv_ids: [quarterly-update-ran]

  - id: multirdf-quarter-pr
    kind: http
    every: 6h
    alert_after: 14d
    describe: No pull request adding a new quarter has been left open for more than two weeks, before its data artifact expires.
    request:
      url: https://api.github.com/search/issues
      params: {q: 'repo:marvinm2/AOP-Wiki_multi-endpoint is:pr is:open in:title "Add AOP-Wiki RDF quarter"', per_page: 1}
      headers: {Accept: application/vnd.github+json}
      parse_json: true
    assert:
      - {that: status, eq: 200}
      - {that: json.total_count, eq: 0, label: "no quarter PR waiting (alerts after 14 days open)"}
    inv_ids: [quarter-pr-not-stale]

  - id: multirdf-endpoint-health
    kind: gha
    every: 1h
    describe: The daily endpoint health workflow for the multi-release endpoint succeeded within the past two days.
    request: {repo: marvinm2/AOP-Wiki_multi-endpoint, workflow: endpoint-health.yml}
    assert:
      - {that: state, eq: active}
      - {that: completed_conclusion, eq: success}
      - {that: last_success_at, max_age: {crit: 2d}}
    inv_ids: [endpoint-health-wf]

  - id: aopwiki-api-live-checks
    kind: gha
    every: 1h
    describe: The weekly live checks of the AOP-Wiki API, run after the Sunday reload, succeeded within the past eight days.
    request: {repo: marvinm2/AOP-Wiki-API, workflow: live.yml}
    assert:
      - {that: state, eq: active}
      - {that: completed_conclusion, eq: success}
      - {that: last_success_at, max_age: {crit: 8d}}
    inv_ids: [watchdog-wfs]
