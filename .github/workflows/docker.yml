name: Docker image

# main -> ghcr.io/tgx-um/tgx-monitor:sha-<7> and :latest; a v* tag -> its semver tags.
# Pull requests build the image but push nothing and never log in.
# Deploys are by hand (DEPLOY.md "Update"): publishing never changes the cluster.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # On pull requests ci.yml runs on its own; here it gates the push.
  ci:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read
    secrets: inherit

  image:
    needs: [ci]
    if: always() && (needs.ci.result == 'success' || needs.ci.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image name is a lowercase literal on purpose: github.repository_owner
      # expands to "TGX-UM" and Docker rejects uppercase repository names.
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/tgx-um/tgx-monitor
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=tgx-monitor
            org.opencontainers.image.description=Monitoring and alerting for the TGX web estate
            org.opencontainers.image.vendor=Department of Translational Genomics, Maastricht University
            org.opencontainers.image.licenses=MIT

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
